Disable Userland Proxy:
  name: Disable Userland Proxy
  requirements:
  - The Docker daemon starts a userland proxy service for port forwarding whenever a port is exposed.
  - This service should be disabled on startup to reduce the attack surface of the installation.
Configure Data Access Control Lists:
  name: Configure Data Access Control Lists
  requirements:
  - Apply data access control lists based on a user’s need to know.
  - Protect all information stored on systems with file system, network share, claims, application, or
    database specific access control lists. These controls will enforce the principle that only authorized
    individuals should have access to the information based on their need to access the information as
    a part of their responsibilities.
Restrict Administrator Privileges to Dedicated Administrator Accounts:
  name: Restrict Administrator Privileges to Dedicated Administrator Accounts
  requirements:
  - Restrict administrator privileges to dedicated administrator accounts on enterprise assets.
  - Conduct general computing activities, such as internet browsing, email, and productivity suite use,
    from the user’s primary, non-privileged account.
  - Use dedicated administrator accounts on enterprise assets
  - Implement processes and technical controls to assign and manage authorization to credentials for user
    accounts, including administrator accounts, as well as service accounts, to enterprise assets
  - Use a dedicated administrator account for each enterprise asset
  - Conduct general computing activities, such as internet browsing, email, and productivity suite use,
    from the user’s primary, non-privileged account
  - Ensure that administrator privileges are restricted to dedicated administrator accounts on enterprise
    assets. Conduct general computing activities, such as internet browsing, email, and productivity suite
    use, from the user's primary, non-privileged account.
Ensure that the Containerd socket file permissions are set to 660 or more restrictively:
  name: Ensure that the Containerd socket file permissions are set to 660 or more restrictively
  requirements:
  - Only root and the members of the root group should be allowed to read and write to the default Containerd
    Unix socket.
  - By default, the permissions for the Containerd socket file is correctly set to 660.
Controlled Use of Administrative Privileges:
  name: Controlled Use of Administrative Privileges
  requirements:
  - You should controlled use administrative privileges to dedicated administrator accounts on enterprise
    assets
  - Only root and members of the root group should be allowed to read and write to the default Containerd
    socket file.
  - Ensure that unnecessary packages are not installed in the container images, as they could increase
    their attack surface
  - Verify that authentications of software packages are verified before uploading to the package registry
  - Validate artifacts signatures before uploading to the package registry
  - Use technical controls, such as digital signatures and version control, to ensure that only authorized
    scripts, such as specific .ps1, .py, etc., files, are allowed to execute. Block unauthorized scripts
    from executing. Reassess bi-annually, or more frequently.
Segment Data Processing and Storage Based on Sensitivity:
  name: Segment Data Processing and Storage Based on Sensitivity
  requirements:
  - Do not process sensitive data on enterprise assets intended for lower sensitivity data.
  - Maintain secure images or templates for all systems in the enterprise based on the organization’s
    approved configuration standards. Any new system deployment or existing system that becomes compromised
    should be imaged using one of those images or templates.
  - Ensure that the Docker socket is not mounted inside any containers (Manual).
  - Restrict administrator privileges to dedicated administrator accounts on enterprise assets. Conduct
    general computing activities, such as internet browsing, email, and productivity suite use, from the
    user’s primary, non-privileged account.
  - Ensure that image sprawl is avoided (Manual).
'CIS Controls: Controls':
  name: 'CIS Controls: Controls'
  requirements:
  - IG 1 IG 2 IG 3
  - v8
6.1 Ensure that image sprawl is avoided (Manual):
  name: 6.1 Ensure that image sprawl is avoided (Manual)
  requirements:
  - Keep only the images that you actually need and establish a workflow to remove old or stale images
    from the host. Additionally, you should use features such as pull-by-digest to get specific images
    from the registry.
