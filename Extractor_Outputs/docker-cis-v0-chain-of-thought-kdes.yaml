Configure Data Access Control Lists:
  name: Configure Data Access Control Lists
  requirements:
  - Apply data access control lists based on a user’s need to know.
  - Implement data access control lists (ACLs) to local and remote file systems, databases, and applications.
Ensure that the daemon.json file ownership is set to root:root:
  name: Ensure that the daemon.json file ownership is set to root:root
  requirements:
  - Verify that the daemon.json file individual ownership and group ownership is correctly set to root.
  - Set the ownership and group ownership for this file to root.
Ensure that the host's IPC namespace is not shared:
  name: Ensure that the host's IPC namespace is not shared
  requirements:
  - Do not directly expose host devices to containers
  - Share specific host processes using the -p switch
  - Use granular permissions as appropriate to your organization.
Enable anti-exploitation features:
  name: Enable anti-exploitation features
  requirements:
